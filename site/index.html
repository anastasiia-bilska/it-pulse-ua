<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="IT Pulse UA — AI-аналітика ринку IT-вакансій України: ролі, рівні, навички, зарплати."
    />
    <title>IT Pulse UA</title>
    <style>
      :root {
        --bg: #f7f8fa;
        --surface: #ffffff;
        --text: #16181d;
        --muted: #555b66;
        --border: #e2e5ea;
        --bar: #2f6fdf;
        --track: #e8edf6;
        --warn-bg: #fff4d6;
        --warn-text: #5c4300;
        --warn-border: #e8c766;
        --link: #1f5bc7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111317;
          --surface: #1a1d23;
          --text: #eceef2;
          --muted: #a3a9b5;
          --border: #2c3039;
          --bar: #6aa0ff;
          --track: #262b35;
          --warn-bg: #3a2f10;
          --warn-text: #ffe4a0;
          --warn-border: #7a6420;
          --link: #8ab4ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      header h1 {
        margin: 0;
        font-size: 1.9rem;
        letter-spacing: -0.01em;
      }
      .subtitle {
        margin: 2px 0 8px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .banner,
      .error {
        margin: 16px 0;
        padding: 12px 16px;
        border-radius: 8px;
        background: var(--warn-bg);
        color: var(--warn-text);
        border: 1px solid var(--warn-border);
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
        margin-top: 16px;
      }
      section.card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        min-width: 0;
      }
      section.card h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .totals {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      .stat-value {
        font-size: 1.8rem;
        font-weight: 700;
        display: block;
      }
      .stat-label {
        color: var(--muted);
        font-size: 0.9rem;
      }
      ul.rows {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .row {
        display: grid;
        grid-template-columns: minmax(0, 9em) 1fr auto;
        align-items: center;
        gap: 8px 12px;
      }
      .row-label {
        overflow-wrap: anywhere;
      }
      .track {
        height: 10px;
        background: var(--track);
        border-radius: 5px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--bar);
        border-radius: 5px;
      }
      .row-value {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.9rem;
        white-space: nowrap;
      }
      .salary-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px 12px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      .salary-row:last-child {
        border-bottom: 0;
      }
      .salary-median {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .salary-detail {
        color: var(--muted);
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        color: var(--muted);
        margin: 0;
      }
      footer {
        margin-top: 32px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      footer a {
        color: var(--link);
      }
      @media (max-width: 480px) {
        .row {
          grid-template-columns: 1fr auto;
        }
        .row .track {
          grid-column: 1 / -1;
          grid-row: 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>IT Pulse UA</h1>
        <p class="subtitle">ринок IT-вакансій України</p>
        <p class="meta" id="updated">Завантаження даних…</p>
      </header>
      <main id="app" aria-live="polite"></main>
      <footer>
        <p>Джерела: RSS DOU та Djinni. Лише агреговані дані, без текстів вакансій.</p>
        <p><a href="https://github.com/anastasiia-bilska/it-pulse-ua">Код проєкту на GitHub</a></p>
      </footer>
    </div>
    <script>
      'use strict';

      const DATA_URL = 'aggregates.json';
      const LOCALE = 'uk-UA';
      const TIME_ZONE = 'Europe/Kyiv';

      const COMMON_LABELS = { not_stated: 'Не вказано', other: 'Інше' };
      const LABELS = {
        source: { dou: 'DOU', djinni: 'Djinni' },
        role: {
          backend: 'Backend',
          frontend: 'Frontend',
          fullstack: 'Fullstack',
          mobile: 'Mobile',
          ml_ai: 'ML / AI',
          data_engineering: 'Data Engineering',
          data_analytics: 'Data Analytics',
          devops: 'DevOps',
          qa: 'QA',
          security: 'Security',
          gamedev: 'GameDev',
          embedded: 'Embedded',
          design: 'Дизайн',
          product: 'Product-менеджмент',
          project: 'Project-менеджмент',
          business_analysis: 'Бізнес-аналіз',
          marketing: 'Маркетинг',
          sales: 'Продажі',
          hr: 'HR',
          support: 'Підтримка',
          management: 'Менеджмент',
        },
        seniority: {
          intern: 'Intern',
          junior: 'Junior',
          middle: 'Middle',
          senior: 'Senior',
          lead: 'Lead',
        },
        work_format: { remote: 'віддалено', office: 'офіс', hybrid: 'гібрид' },
        english: {
          none: 'не потрібна',
          basic: 'basic',
          intermediate: 'intermediate',
          upper: 'upper-intermediate',
          fluent: 'fluent',
        },
        company_type: { product: 'продуктова', outsource: 'аутсорс', outstaff: 'аутстаф' },
        domain: {
          fintech: 'FinTech',
          igaming: 'iGaming',
          gamedev: 'GameDev',
          ecommerce: 'E-commerce',
          healthtech: 'HealthTech',
          edtech: 'EdTech',
          adtech: 'AdTech',
          martech: 'MarTech',
          defense: 'оборона',
          govtech: 'GovTech',
          logistics: 'логістика',
          telecom: 'телеком',
          automotive: 'автомобільна',
          cybersecurity: 'кібербезпека',
          ai: 'AI',
        },
      };

      const dateFormat = new Intl.DateTimeFormat(LOCALE, {
        dateStyle: 'long',
        timeStyle: 'short',
        timeZone: TIME_ZONE,
      });
      const numberFormat = new Intl.NumberFormat(LOCALE);
      const usdFormat = new Intl.NumberFormat(LOCALE, {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0,
      });

      const app = document.getElementById('app');

      function label(dimension, value) {
        return (LABELS[dimension] || {})[value] ?? COMMON_LABELS[value] ?? value;
      }

      function formatDate(iso) {
        return dateFormat.format(new Date(iso));
      }

      function formatShare(share, n) {
        return `${Math.round(share * 100)}% · n=${numberFormat.format(n)}`;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function card(title, ...children) {
        const section = el('section', 'card');
        section.append(el('h2', null, title), ...children);
        return section;
      }

      function emptyNote() {
        return el('p', 'empty', 'Поки немає даних.');
      }

      function barRow(labelText, fraction, valueText) {
        const li = el('li', 'row');
        const track = el('div', 'track');
        track.setAttribute('aria-hidden', 'true');
        const fill = el('div', 'fill');
        fill.style.width = `${Math.max(0, Math.min(1, fraction)) * 100}%`;
        track.append(fill);
        li.append(el('span', 'row-label', labelText), track, el('span', 'row-value', valueText));
        return li;
      }

      function distributionList(dimension, items) {
        if (!items || items.length === 0) return emptyNote();
        const list = el('ul', 'rows');
        for (const item of items) {
          list.append(
            barRow(label(dimension, item.value), item.share, formatShare(item.share, item.n)),
          );
        }
        return list;
      }

      function skillsList(skills) {
        if (!skills || skills.length === 0) return emptyNote();
        const maxN = Math.max(...skills.map((s) => s.n));
        const list = el('ul', 'rows');
        for (const skill of skills) {
          list.append(barRow(skill.value, skill.n / maxN, `n=${numberFormat.format(skill.n)}`));
        }
        return list;
      }

      function salaryRow(dimension, row, minN) {
        const div = el('div', 'salary-row');
        div.append(el('span', 'row-label', label(dimension, row.group)));
        if (row.median === null) {
          div.append(el('span', 'salary-detail', `даних замало (n=${row.n}, потрібно ≥${minN})`));
          return div;
        }
        const value = el('span');
        value.append(
          el('span', 'salary-median', `${usdFormat.format(row.median)} / міс`),
          el(
            'span',
            'salary-detail',
            ` · p25–p75: ${usdFormat.format(row.p25)}–${usdFormat.format(row.p75)} · n=${numberFormat.format(row.n)}`,
          ),
        );
        div.append(value);
        return div;
      }

      function salaryList(dimension, rows, minN) {
        if (!rows || rows.length === 0) return emptyNote();
        const wrap = el('div');
        for (const row of rows) wrap.append(salaryRow(dimension, row, minN));
        return wrap;
      }

      function stat(value, caption) {
        const div = el('div');
        div.append(el('span', 'stat-value', value), el('span', 'stat-label', caption));
        return div;
      }

      function totalsCard(data) {
        const { vacancies, extracted } = data.totals;
        const box = el('div', 'totals');
        box.append(
          stat(numberFormat.format(vacancies), `вакансій за останні ${data.windowDays} днів`),
          stat(
            `${numberFormat.format(extracted)} / ${numberFormat.format(vacancies)}`,
            'проаналізовано AI',
          ),
        );
        return card('Загалом', box);
      }

      function freshnessBanner(freshness) {
        const asOf = freshness.lastOkAt
          ? `Статистика актуальна на ${formatDate(freshness.lastOkAt)}`
          : 'Статистика ще не сформована';
        const text =
          `Аналіз нових вакансій затримується: ${freshness.reason ?? 'причина невідома'}. ` +
          `У черзі ${numberFormat.format(freshness.backlog)} вакансій. ${asOf}`;
        const banner = el('p', 'banner', text);
        banner.setAttribute('role', 'status');
        return banner;
      }

      function render(data) {
        document.getElementById('updated').textContent =
          `Дані оновлено: ${formatDate(data.generatedAt)}`;
        const d = data.distributions;
        const grid = el('div', 'grid');
        grid.append(
          totalsCard(data),
          card('Ролі', distributionList('role', d.role)),
          card('Рівень', distributionList('seniority', d.seniority)),
          card('Топ навичок', skillsList(data.topSkills)),
          card(
            'Зарплата за роллю, USD/міс (медіана)',
            salaryList('role', data.salaryUsdMonthByRole, data.minN),
          ),
          card(
            'Зарплата за рівнем, USD/міс (медіана)',
            salaryList('seniority', data.salaryUsdMonthBySeniority, data.minN),
          ),
          card('Формат роботи', distributionList('work_format', d.work_format)),
          card('Англійська', distributionList('english', d.english)),
          card('Тип компанії', distributionList('company_type', d.company_type)),
          card('Домен', distributionList('domain', d.domain)),
          card('Джерела', distributionList('source', d.source)),
        );
        app.replaceChildren();
        if (data.freshness.isStale) app.append(freshnessBanner(data.freshness));
        app.append(grid);
      }

      function renderError() {
        document.getElementById('updated').textContent = 'Дані недоступні';
        app.replaceChildren(
          el(
            'p',
            'error',
            'Не вдалося завантажити статистику. Спробуйте оновити сторінку трохи пізніше.',
          ),
        );
      }

      async function main() {
        try {
          const response = await fetch(DATA_URL, { cache: 'no-cache' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch (error) {
          console.error(error);
          renderError();
        }
      }

      main();
    </script>
  </body>
</html>
