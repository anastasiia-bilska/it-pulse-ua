name: dashboard

# Rebuilds the public dashboard (aggregates only) after every extract run and publishes it to
# Cloudflare Pages (ADR 0011, ADR 0015). The daily schedule keeps the freshness banner honest even
# if extraction stops running altogether.
on:
  workflow_run:
    workflows: [extract]
    types: [completed]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: https://it-pulse-ua.pages.dev
    env:
      # Read-only access is enough to compute aggregates.
      DATABASE_URL: ${{ secrets.DATABASE_URL_EXTRACTOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Order matters: the web build empties dist/site, then the CLI adds aggregates.json to it.
      - run: npm run build:web
      - run: npm run dashboard
      # dist/site carries web/public/_headers, the cache rules Cloudflare Pages applies.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: pages deploy dist/site --project-name=it-pulse-ua --branch=main
