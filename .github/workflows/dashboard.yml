name: dashboard

# Rebuilds the public dashboard (aggregates only) and publishes it to Cloudflare Pages (ADR 0011,
# ADR 0015), then checks the live site (ADR 0016). The daily schedule keeps the freshness banner
# honest even if extraction stops running altogether.
on:
  # A merged change to the page reaches readers at once, not at the next extract run.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard.yml'
      - '.github/scripts/smoke-check.sh'
  # After every extract run, and after a new digest episode so its player and transcript appear.
  workflow_run:
    workflows: [extract, digest]
    types: [completed]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: https://it-pulse-ua.pages.dev
    env:
      # Read-only access is enough to compute aggregates.
      DATABASE_URL: ${{ secrets.DATABASE_URL_EXTRACTOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Order matters: the web build empties dist/site, then the CLI adds aggregates.json to it.
      - run: npm run build:web
      # The latest digest episode (ADR 0013): its scripts go into aggregates.json, and its audio is
      # served from this site. GitHub serves release files as octet-stream downloads, which iOS
      # Safari refuses to play.
      - name: Latest digest episode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --pattern 'digest*' --dir dist/digest-latest --clobber; then
            mkdir -p dist/site/digest
            cp dist/digest-latest/digest-*.mp3 dist/site/digest/
          else
            echo "no digest episode yet"
          fi
      - run: npm run dashboard
      # The og:image with this build's numbers. A card that fails to render must not stop the
      # deploy: the page is what readers come for, the preview only falls back to no image.
      - name: Social card
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run social-card
      # dist/site carries web/public/_headers, the cache rules Cloudflare Pages applies.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: pages deploy dist/site --project-name=it-pulse-ua --branch=main
      # A deploy that went through can still serve a broken page: check what readers get.
      - name: Smoke check of the live site
        run: .github/scripts/smoke-check.sh https://it-pulse-ua.pages.dev dist/site/aggregates.json
